# jigsaw-unintended-bias-in-toxicity-classification — ABC experiment, seed 45.
# Same model, resources and arm settings as job-jigsaw-unintended-abc-s44.yaml.
#
#   A  mlevolve-jubias-base-s45     no knowledge base
#   B  mlevolve-jubias-kb-s45       KB on, draft-stage injection only
#   C  mlevolve-jubias-kbimp-s45    KB on, draft AND improve stages
#
#   kubectl apply -f k8s/job-jigsaw-unintended-abc-s45.yaml     # 3 GPUs
#
# Each Job generates 3 initial drafts and runs up to 3 candidates concurrently on 1 GPU.
# SERVER_IDs 69-71 use grading ports 5074-5076.
# Data preparation and cache checks: see k8s/job-jigsaw-unintended-abc.yaml.
# Verify the shared data and retrieval caches are ready before launching the KB arms.
apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-jubias-base-s45
  labels:
    app: mlevolve
    experiment: jigsaw-unintended-bias
    repeat: "9"
    variant: kb-off
    arm: a-baseline
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400     # 24 h wall clock, and it counts Pending time (see README)
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: mlevolve
        experiment: jigsaw-unintended-bias
        repeat: "9"
        variant: kb-off
        arm: a-baseline
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.compute.major
                    operator: Gt
                    values: [ '6' ]
      restartPolicy: Never
      containers:
      - name: mlevolve
        image: pytorch/pytorch:2.7.1-cuda12.6-cudnn9-runtime
        command: ["bash", "/workspace/MLEvolve/k8s/entrypoint.sh"]
        env:
        - name: EXP_ID
          value: "jigsaw-unintended-bias-in-toxicity-classification"
        - name: DATASET_DIR
          value: "/workspace/data/mlebench"
        - name: REPO_DIR
          value: "/workspace/MLEvolve"
        - name: EXP_NAME
          value: "jubias-base-s45"
        - name: CPUS_PER_TASK
          value: "8"
        - name: SERVER_ID
          value: "69"               # port 5074
        - name: EXTRA_RUN_ARGS
          value: "agent.seed=45 agent.initial_drafts=3 agent.search.parallel_search_num=3 agent.search.num_gpus=1"
        # Route the agent through the shared proxy. These two are not secrets; the key is.
        # `env` takes precedence over `envFrom`, so this wins over any stale mlevolve-llm value.
        - name: LLM_BASE_URL
          value: "http://cliproxy:8317/v1"
        - name: LLM_MODEL
          value: "gpt-5.6-terra"     # verified: max_completion_tokens, tools and streaming all work
        envFrom:
        - secretRef:
            name: mlevolve-llm-proxy  # must provide LLM_API_KEY
        resources:                 # identical across all three arms
          requests:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: yuze-li-vol
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
