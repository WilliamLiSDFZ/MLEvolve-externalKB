# jigsaw-unintended-bias-in-toxicity-classification — three-arm experiment, DRAW 43, through the shared CLIProxyAPI.
#
#   A  mlevolve-jubias-base-s43     no knowledge base
#   B  mlevolve-jubias-kb-s43       KB on, draft-stage injection only
#   C  mlevolve-jubias-kbimp-s43    KB on, draft AND improve stages
#
#   kubectl apply  -f k8s/job-jigsaw-unintended-abc-s43.yaml     # 3 GPUs
#   kubectl delete -f k8s/job-jigsaw-unintended-abc-s43.yaml
#
# Rationale, prepare-task command and the checks are in k8s/job-jigsaw-unintended-abc.yaml — read that file.
#
# prepare-task.sh does NOT need re-running for this seed: the data is already prepared and the
# query/extraction caches are warm from draw 1. Confirm before launching rather than assuming —
# a cold cache makes concurrent arms race, which is what invalidated the essay seed-42 draw:
#
#   kubectl exec <dev-pod> -- ls /workspace/data/mlebench/jigsaw-unintended-bias-in-toxicity-classification/prepared/public
#
# Launch this together with s44 if six GPUs are free. They are separated by seed, so the
# 2026-08-25 draw-clustering fix keeps them as distinct draws even when started minutes apart —
# but leave a gap anyway if convenient, since the seed is the only thing separating them.
apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-jubias-base-s43
  labels:
    app: mlevolve
    experiment: jigsaw-unintended-bias
    repeat: "9"
    variant: kb-off
    arm: a-baseline
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400     # 24 h wall clock, and it counts Pending time (see README)
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: mlevolve
        experiment: jigsaw-unintended-bias
        repeat: "9"
        variant: kb-off
        arm: a-baseline
    spec:
      restartPolicy: Never
      containers:
      - name: mlevolve
        image: pytorch/pytorch:2.7.1-cuda12.6-cudnn9-runtime
        command: ["bash", "/workspace/MLEvolve/k8s/entrypoint.sh"]
        env:
        - name: EXP_ID
          value: "jigsaw-unintended-bias-in-toxicity-classification"
        - name: DATASET_DIR
          value: "/workspace/data/mlebench"
        - name: REPO_DIR
          value: "/workspace/MLEvolve"
        - name: EXP_NAME
          value: "jubias-base-s43"
        - name: CPUS_PER_TASK
          value: "8"
        - name: SERVER_ID
          value: "54"               # port 5059
        - name: EXTRA_RUN_ARGS
          value: "agent.seed=43"
        # Route the agent through the shared proxy. These two are not secrets; the key is.
        # `env` takes precedence over `envFrom`, so this wins over any stale mlevolve-llm value.
        - name: LLM_BASE_URL
          value: "http://cliproxy:8317/v1"
        - name: LLM_MODEL
          value: "gpt-5.6-terra"     # verified: max_completion_tokens, tools and streaming all work
        envFrom:
        - secretRef:
            name: mlevolve-llm-proxy  # must provide LLM_API_KEY
        resources:                 # identical across all three arms
          requests:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: yuze-li-vol
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
