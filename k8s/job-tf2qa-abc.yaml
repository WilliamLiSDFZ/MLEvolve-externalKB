# tensorflow2-question-answering (Natural Questions) — three-arm experiment, DRAW 1 (seed 42),
# through the shared CLIProxyAPI. All three run concurrently.
#
#   A  mlevolve-tf2qa-base-s42    no knowledge base
#   B  mlevolve-tf2qa-kb-s42      KB on, draft-stage injection only
#   C  mlevolve-tf2qa-kbimp-s42   KB on, draft AND improve stages
#
#   bash k8s/prepare-task.sh tensorflow2-question-answering \
#        "question,answering,reading,comprehension,retrieval,passage,span,extractive,wikipedia,context"
#   kubectl apply  -f k8s/job-tf2qa-abc.yaml     # 3 GPUs
#   kubectl delete -f k8s/job-tf2qa-abc.yaml
#
# ══ WHY THIS TASK ══════════════════════════════════════════════════════════════════════
# This is the answer to the review's "找一下有没有哪个 task 的 dataset 是在 10GB 左右的".
# Natural Questions ships full Wikipedia articles as context, so the dataset is ~20 GB against
# jigsaw-toxic's roughly 60 MB — the largest task attempted here by a wide margin. 307K training
# examples.
#
# It is also NLP, which matters: the corpus is aaai/acl/iclr/icml/naacl/neurips 2024+2025 plus
# iccv-2023, so four pure-NLP venue-years against one vision venue. ACL and NAACL are full of QA,
# retrieval and long-context work, so for once the corpus should contain methods that are both
# relevant AND executable — the failure mode that has dominated this project.
#
# ── But this task carries a real risk, and it should be named before launching ───────────
# It is reading comprehension, not classification: retrieve a long answer (a paragraph) and a
# short answer (a span) from a full Wikipedia page, scored by micro F1. That is structurally
# harder than anything attempted so far, and lmsys is the cautionary case — on that task two of
# three arms produced ZERO valid solutions in twelve hours, 21-28 nodes each, all buggy.
#
# So the first thing to check is not the score or even adoption, but whether the agent produces
# a valid submission at all:
#
#   kubectl exec <dev-pod> -- bash -c 'for r in /workspace/MLEvolve/runs/*tf2qa-*-s42; do
#     echo "$(basename $r): $(ls $r/workspace/submission 2>/dev/null | wc -l) submissions"; done'
#
# If all three arms sit at zero after a few hours, the honest conclusion is that this task is
# beyond the agent at a 12 h budget, and that is worth reporting rather than repeating.
#
# ── Storage: check before preparing ─────────────────────────────────────────────────────
# ~20 GB raw plus the prepared split, on a 512 Gi PVC that already holds several competitions,
# the paper corpus and the run archives.
#
#   kubectl exec <dev-pod> -- df -h /workspace
#
# ── prepare-task.sh, and why phase 3 is not optional ────────────────────────────────────
# It downloads and splits the data, HARD-GATES on retrieval quality (exits non-zero below 8/10
# on-topic), then warms the query and extraction caches. The warming is a correctness
# requirement, not a speed-up: on a cold cache two arms launched together each distil their own
# query via the LLM, get DIFFERENT sampled queries, and race on the same tmp paths. That is what
# invalidated the essay seed-42 draw.
#
# Keyword note: probe keywords are matched against paper TITLES. A keyword matching nothing
# anywhere silently deflates the gate score, and hyphenated compounds have caused a false gate
# failure before (lmsys: "human-feedback", "llm-eval"). probe_retrieval.py warns about dead
# keywords — read the warning before believing a low score.
#
# ── This is a fresh task: it starts at n=0 ──────────────────────────────────────────────
# Nothing here is poolable with jigsaw, essay or lmsys. Draws 42-44 give n=3, which is enough to
# see whether the agent can solve the task at all and roughly where adoption lands, and nowhere
# near enough for a score claim.
#
# ── Checks in the first ~40 minutes ─────────────────────────────────────────────────────
#   kubectl logs job/mlevolve-tf2qa-kb-s42 | grep -E "\[Filter\]|KB venues|injected at draft"
#   kubectl exec <dev-pod> -- cat /workspace/MLEvolve/runs/<run>/logs/paper_filter.md
# Both KB arms must print the same draft digest and the same KB snapshot digest.
apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-tf2qa-base-s42
  labels:
    app: mlevolve
    experiment: tf2-qa
    repeat: "9"
    variant: kb-off
    arm: a-baseline
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400     # 24 h wall clock, and it counts Pending time (see README)
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: mlevolve
        experiment: tf2-qa
        repeat: "9"
        variant: kb-off
        arm: a-baseline
    spec:
      restartPolicy: Never
      containers:
      - name: mlevolve
        image: pytorch/pytorch:2.7.1-cuda12.6-cudnn9-runtime
        command: ["bash", "/workspace/MLEvolve/k8s/entrypoint.sh"]
        env:
        - name: EXP_ID
          value: "tensorflow2-question-answering"
        - name: DATASET_DIR
          value: "/workspace/data/mlebench"
        - name: REPO_DIR
          value: "/workspace/MLEvolve"
        - name: EXP_NAME
          value: "tf2qa-base-s42"
        - name: CPUS_PER_TASK
          value: "8"
        - name: SERVER_ID
          value: "60"               # port 5065
        - name: EXTRA_RUN_ARGS
          value: "agent.seed=42"
        # Route the agent through the shared proxy. These two are not secrets; the key is.
        # `env` takes precedence over `envFrom`, so this wins over any stale mlevolve-llm value.
        - name: LLM_BASE_URL
          value: "http://cliproxy:8317/v1"
        - name: LLM_MODEL
          value: "gpt-5.6-terra"     # verified: max_completion_tokens, tools and streaming all work
        envFrom:
        - secretRef:
            name: mlevolve-llm-proxy  # must provide LLM_API_KEY
        resources:                 # identical across all three arms
          requests:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: yuze-li-vol
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
