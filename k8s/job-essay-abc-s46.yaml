# learning-agency-lab-automated-essay-scoring-2 — three-arm experiment, REPEAT 5 (seed 46),
# through the shared CLIProxyAPI. All three run concurrently.
#
#   A  mlevolve-essay-base-s46    no knowledge base
#   B  mlevolve-essay-kb-s46      KB on, draft-stage injection only
#   C  mlevolve-essay-kbimp-s46   KB on, draft AND improve stages
#
#   kubectl apply  -f k8s/job-essay-abc-s46.yaml     # 3 GPUs
#   kubectl delete -f k8s/job-essay-abc-s46.yaml
#
# The rationale, the numbers and the three caveats are in job-essay-abc-s45.yaml — read that
# file, not this one. In short: this pair of repeats exists to take the C-A valid-solution-rate
# contrast from n=3 to n=5, which is the only interval in the project that excludes zero and the
# gap AutoMind's ablation leaves open. It is NOT expected to move the QWK score contrast, whose
# paired sd of 0.038 puts significance a few hundred draws away.
#
# Launch this one together with s45 if six GPUs are free, or immediately after it. Running them
# in the same batch is slightly preferable: same paper cache, same proxy state, and the draws stay
# comparable in the ways that have bitten this project before.
#
# One thing to check once BOTH have finished, before reporting anything:
#
#   python scripts/analyze_runs.py --runs ~/nautilus/results \
#       --manual-exclusions results/8.17/manual_exclusions.yaml --charts
#
# and confirm in <task>_process.png that C-A still clears zero at n=5. If it does not, the n=3
# result was the 2026-08-14 draw — whose arm A produced 1 valid solution out of 14 — carrying it,
# and that is the honest finding to report instead.
apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-essay-base-s46
  labels:
    app: mlevolve
    experiment: essay
    repeat: "9"
    variant: kb-off
    arm: a-baseline
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 46800
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: mlevolve
        experiment: essay
        repeat: "9"
        variant: kb-off
        arm: a-baseline
    spec:
      restartPolicy: Never
      containers:
      - name: mlevolve
        image: pytorch/pytorch:2.7.1-cuda12.6-cudnn9-runtime
        command: ["bash", "/workspace/MLEvolve/k8s/entrypoint.sh"]
        env:
        - name: EXP_ID
          value: "learning-agency-lab-automated-essay-scoring-2"
        - name: DATASET_DIR
          value: "/workspace/data/mlebench"
        - name: REPO_DIR
          value: "/workspace/MLEvolve"
        - name: EXP_NAME
          value: "essay-base-s46"
        - name: CPUS_PER_TASK
          value: "8"
        - name: SERVER_ID
          value: "42"               # port 5047
        - name: EXTRA_RUN_ARGS
          value: "agent.seed=46"
        # Route the agent through the shared proxy. These two are not secrets; the key is.
        # `env` takes precedence over `envFrom`, so this wins over any stale mlevolve-llm value.
        - name: LLM_BASE_URL
          value: "http://cliproxy:8317/v1"
        - name: LLM_MODEL
          value: "gpt-5.6-terra"     # verified: max_completion_tokens, tools and streaming all work
        envFrom:
        - secretRef:
            name: mlevolve-llm-proxy  # must provide LLM_API_KEY
        resources:                 # identical across all three arms
          requests:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: yuze-li-vol
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
