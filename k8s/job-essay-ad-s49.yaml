# learning-agency-lab-automated-essay-scoring-2 — two-arm experiment (seed 49), through the
# shared CLIProxyAPI. Both run concurrently.
#
#   A  mlevolve-essay-base-s49    no knowledge base
#   D  mlevolve-essay-ana-s49     analogy retrieval at every improve node (engine/analogy)
#
#   kubectl apply  -f k8s/job-essay-ad-s49.yaml     # 2 GPUs
#   kubectl delete -f k8s/job-essay-ad-s49.yaml
#
# This is the first draw of the improve-stage analogy agent (design:
# Agentic_Knowledge_Base/docs/analogy_bm25_agent_design.md). There is no B/C here: the
# cold-start retrieval those arms used is gone from this branch, and the historical B/C runs
# (results/9.2 and earlier) are the "task-semantic retrieval" baseline the design refers to.
#
# Before launching:
#   bash k8s/prepare-task.sh learning-agency-lab-automated-essay-scoring-2
# which only checks the dataset and that /workspace/Agentic_Knowledge_Base/output/paper_corpus
# exists (built by the KB repo's scripts/6_build_paper_corpus.py). Nothing needs warming: the
# agent's query is each node's own diagnosed bottleneck, so there is no shared cache and the
# two arms cannot race on one.
#
# ── What to look at first (n=1 draw, no statistics needed) ───────────────────────────────
#
#   ./fetch-run.sh --all
#   less ~/nautilus/results/<D run>/logs/analogy/index.jsonl     # one line per improve node
#   less ~/nautilus/results/<D run>/logs/analogy/<parent>_001.md  # packet, queries, hits, report
#
# 1. Did the agent produce reports (ok=true) at most improve nodes, in <= 10 turns, and do the
#    diagnosed bottlenecks match what the node's execution summary actually says?
# 2. Are the queries free of the competition's own nouns (essay, score, student...) and do the
#    hits come from other subfields? (design §6: mechanism-family hit is the primary metric)
# 3. Adoption: run the KB repo's measure_adoption.py — for arm D it judges each improve node
#    against its own report. Compare with the 3% (jigsaw) / 88% (essay) B/C numbers.
# 4. Only then score: analyze_runs.py contrasts D-A at matched K.
apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-essay-base-s49
  labels:
    app: mlevolve
    experiment: essay
    repeat: "10"
    variant: kb-off
    arm: a-baseline
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400     # 24 h wall clock, and it counts Pending time (see README)
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: mlevolve
        experiment: essay
        repeat: "10"
        variant: kb-off
        arm: a-baseline
    spec:
      restartPolicy: Never
      containers:
      - name: mlevolve
        image: pytorch/pytorch:2.7.1-cuda12.6-cudnn9-runtime
        command: ["bash", "/workspace/MLEvolve/k8s/entrypoint.sh"]
        env:
        - name: EXP_ID
          value: "learning-agency-lab-automated-essay-scoring-2"
        - name: DATASET_DIR
          value: "/workspace/data/mlebench"
        - name: REPO_DIR
          value: "/workspace/MLEvolve"
        - name: EXP_NAME
          value: "essay-base-s49"
        - name: CPUS_PER_TASK
          value: "8"
        - name: SERVER_ID
          value: "69"               # port 5074
        - name: EXTRA_RUN_ARGS
          value: "agent.seed=49"
        # Route the agent through the shared proxy. These two are not secrets; the key is.
        # `env` takes precedence over `envFrom`, so this wins over any stale mlevolve-llm value.
        - name: LLM_BASE_URL
          value: "http://cliproxy:8317/v1"
        - name: LLM_MODEL
          value: "gpt-5.6-terra"     # verified: max_completion_tokens, tools and streaming all work
        envFrom:
        - secretRef:
            name: mlevolve-llm-proxy  # must provide LLM_API_KEY
        resources:                 # identical across both arms
          requests:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: yuze-li-vol
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-essay-ana-s49
  labels:
    app: mlevolve
    experiment: essay
    repeat: "10"
    variant: analogy-on
    arm: d-analogy-improve
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400     # 24 h wall clock, and it counts Pending time (see README)
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: mlevolve
        experiment: essay
        repeat: "10"
        variant: analogy-on
        arm: d-analogy-improve
    spec:
      restartPolicy: Never
      containers:
      - name: mlevolve
        image: pytorch/pytorch:2.7.1-cuda12.6-cudnn9-runtime
        command: ["bash", "/workspace/MLEvolve/k8s/entrypoint.sh"]
        env:
        - name: EXP_ID
          value: "learning-agency-lab-automated-essay-scoring-2"
        - name: DATASET_DIR
          value: "/workspace/data/mlebench"
        - name: REPO_DIR
          value: "/workspace/MLEvolve"
        - name: EXP_NAME
          value: "essay-ana-s49"
        - name: CPUS_PER_TASK
          value: "8"
        - name: SERVER_ID
          value: "70"               # port 5075
        - name: EXTRA_RUN_ARGS
          value: >-
            agent.seed=49
            analogy.enabled=True
            analogy.corpus_path=/workspace/Agentic_Knowledge_Base/output/paper_corpus
        # Route the agent through the shared proxy. These two are not secrets; the key is.
        # `env` takes precedence over `envFrom`, so this wins over any stale mlevolve-llm value.
        - name: LLM_BASE_URL
          value: "http://cliproxy:8317/v1"
        - name: LLM_MODEL
          value: "gpt-5.6-terra"     # verified: max_completion_tokens, tools and streaming all work
        envFrom:
        - secretRef:
            name: mlevolve-llm-proxy  # must provide LLM_API_KEY
        resources:                 # identical across both arms
          requests:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: yuze-li-vol
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
