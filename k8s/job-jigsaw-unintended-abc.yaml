# jigsaw-unintended-bias-in-toxicity-classification — three-arm experiment, DRAW 1 (seed 42),
# through the shared CLIProxyAPI. All three run concurrently.
#
#   A  mlevolve-jubias-base-s42    no knowledge base
#   B  mlevolve-jubias-kb-s42      KB on, draft-stage injection only
#   C  mlevolve-jubias-kbimp-s42   KB on, draft AND improve stages
#
#   bash k8s/prepare-task.sh jigsaw-unintended-bias-in-toxicity-classification \
#        "toxic,toxicity,offensive,hate,abusive,bias,fairness,debias,identity,comment,moderation"
#   kubectl apply  -f k8s/job-jigsaw-unintended-abc.yaml     # 3 GPUs
#   kubectl delete -f k8s/job-jigsaw-unintended-abc.yaml
#
# ══ WHY THIS TASK, AND WHY IT IS THE RIGHT TEST OF THE AGENT FILTER ════════════════════
# 1.8M training rows against jigsaw-toxic's 159K — an 11x answer to "the task is too small",
# from the review. But size is not the reason it was chosen first.
#
# It reuses the SAME RETRIEVAL POOL as jigsaw-toxic, where we know exactly what goes wrong.
# jigsaw-toxic was handed:
#
#     Fine-tuned CLIP multimodal encoder      Image captions for targeted-harmful memes
#     Multimodal image-text modeling          Inline-text captions for dispirited-culture memes
#
# for a text-only competition, and adopted techniques in 3 of 89 nodes (3%). Those same
# multimodal meme papers will be retrieved here, because the domain is the same. So this run has
# a KNOWN CORRECT ANSWER: `logs/paper_filter.md` must mark them `infeasible`. That is a much
# sharper test than moving to an unfamiliar domain, where a bad filter and a bad corpus match
# would be indistinguishable.
#
# It also keeps one variable moving at a time. A vision task would change the domain AND the
# filter at once, and the corpus has only one vision venue (iccv-2023) against four NLP
# venue-years, so a vision failure could not be attributed.
#
# ── First run with the new retrieval path ───────────────────────────────────────────────
# This is the first experiment using `agent_paper_filter: True` (2026-08-26). The second-stage
# technique reranker is bypassed; every surviving paper's techniques are injected whole, and the
# truncation budgets were raised (retr_token_budget 6000 -> 25000, improve 2000 -> 12000).
#
# THE PRIMARY METRIC IS ADOPTION, NOT SCORE. jigsaw-toxic sits at 3%. One draw is enough to see
# whether the filter moved it, with no statistics at all. Score would need 8+ draws and this is
# draw 1 — do not read the QWK/AUC numbers as a result.
#
# ── prepare-task.sh is mandatory, and its phase 3 is a correctness requirement ───────────
# Not an optimisation. On a fresh task the query cache is empty, so two arms launched together
# each call the LLM to distil the query, get two DIFFERENT sampled queries, and race on the same
# tmp paths — which is exactly what invalidated the essay seed-42 draw. The script downloads the
# data, hard-gates on retrieval quality (exits non-zero below 8/10 on-topic), warms the caches,
# then replays what each arm will see.
#
# Keywords matter: they are matched against paper TITLES, and a keyword matching nothing anywhere
# silently deflates the gate. probe_retrieval.py warns about dead keywords — read that warning
# before believing a low score. Hyphenated compounds like "human-feedback" have failed this way
# before.
#
# ── Data size ───────────────────────────────────────────────────────────────────────────
# 1.8M rows. Check free space on the PVC before preparing; the raw download plus the prepared
# split is the largest task attempted so far.
#
#   kubectl exec <dev-pod> -- df -h /workspace
#
# ── Checks in the first ~40 minutes ─────────────────────────────────────────────────────
#   kubectl logs job/mlevolve-jubias-kb-s42 | grep -E "\[Filter\]|KB venues|injected at draft"
#   kubectl exec <dev-pod> -- cat /workspace/MLEvolve/runs/<run>/logs/paper_filter.md
#
# In paper_filter.md, confirm: multimodal/meme papers marked `infeasible`, at least
# filter_min_keep=5 survivors, no "every batch failed" warning. Both KB arms must print the same
# draft digest and the same KB snapshot digest.
apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-jubias-base-s42
  labels:
    app: mlevolve
    experiment: jigsaw-unintended-bias
    repeat: "9"
    variant: kb-off
    arm: a-baseline
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 46800
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: mlevolve
        experiment: jigsaw-unintended-bias
        repeat: "9"
        variant: kb-off
        arm: a-baseline
    spec:
      restartPolicy: Never
      containers:
      - name: mlevolve
        image: pytorch/pytorch:2.7.1-cuda12.6-cudnn9-runtime
        command: ["bash", "/workspace/MLEvolve/k8s/entrypoint.sh"]
        env:
        - name: EXP_ID
          value: "jigsaw-unintended-bias-in-toxicity-classification"
        - name: DATASET_DIR
          value: "/workspace/data/mlebench"
        - name: REPO_DIR
          value: "/workspace/MLEvolve"
        - name: EXP_NAME
          value: "jubias-base-s42"
        - name: CPUS_PER_TASK
          value: "8"
        - name: SERVER_ID
          value: "51"               # port 5056
        - name: EXTRA_RUN_ARGS
          value: "agent.seed=42"
        # Route the agent through the shared proxy. These two are not secrets; the key is.
        # `env` takes precedence over `envFrom`, so this wins over any stale mlevolve-llm value.
        - name: LLM_BASE_URL
          value: "http://cliproxy:8317/v1"
        - name: LLM_MODEL
          value: "gpt-5.6-terra"     # verified: max_completion_tokens, tools and streaming all work
        envFrom:
        - secretRef:
            name: mlevolve-llm-proxy  # must provide LLM_API_KEY
        resources:                 # identical across all three arms
          requests:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: yuze-li-vol
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
