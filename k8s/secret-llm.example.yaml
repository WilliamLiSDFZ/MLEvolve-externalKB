# LLM credentials for MLEvolve jobs — template.
# Copy, fill in, apply; do NOT commit the filled copy.
#   cp k8s/secret-llm.example.yaml /tmp/secret-llm.yaml   # edit values
#   kubectl -n <NAMESPACE> apply -f /tmp/secret-llm.yaml
#
# The Job maps these via envFrom; k8s/entrypoint.sh turns them into
# `agent.code.* / agent.feedback.*` overrides for run.py. The secret is optional —
# alternatively fill config/config.yaml in the PVC checkout and skip this.
apiVersion: v1
kind: Secret
metadata:
  name: mlevolve-llm
type: Opaque
stringData:
  LLM_API_KEY: "sk-proj-REPLACE_ME"             # your OpenAI API key
  LLM_BASE_URL: "https://api.openai.com/v1"     # OpenAI API
  LLM_MODEL: "gpt-5.6-terra"                    # model for both code & feedback slots
                                                # (gpt-5.6-sol = flagship, gpt-5.6-luna = cheapest)
