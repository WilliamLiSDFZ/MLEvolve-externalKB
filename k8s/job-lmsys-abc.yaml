# lmsys-chatbot-arena — three-arm knowledge-base experiment, through the shared CLIProxyAPI.
# All three run concurrently, same seed.
#
#   A  mlevolve-lmsys-base   no knowledge base
#   B  mlevolve-lmsys-kb     KB on, draft-stage injection only
#   C  mlevolve-lmsys-kbimp  KB on, draft AND improve stages
#
#   kubectl apply  -f k8s/job-lmsys-abc.yaml     # 3 GPUs
#   kubectl delete -f k8s/job-lmsys-abc.yaml
#
# Same three contrasts as the essay experiment: A vs B (does the KB help at all), B vs C (does
# widening the injection surface help), A vs C (best KB configuration vs none). All three start
# together so day/node/load variation is common-mode and cancels pairwise.
#
# ── Why this task, and why it pairs with essay ──────────────────────────────────────────
# Corpus coverage is specific: ~130 papers, essentially all inside `llm-evaluation-*`
# categories (llm-evaluation-summarization-argumentation, web-data-quality-and-llm-evaluation,
# llm-evaluation-summarization-opinion). Not incidental matches.
#
# It pairs with learning-agency-lab-automated-essay-scoring-2 as a partial contamination
# control — PARTIAL, and the earlier claim that it was clean was too strong. The probe's top
# hits here are "Chatbot Arena: An Open Platform for Evaluating LLMs by Human Preference"
# (twice, ICML 2024 and 2025) and "LMSYS-Chat-1M": the papers describing the very platform and
# dataset this competition is built from. The corpus is not innocent of this task.
#
# The difference from essay is one of kind rather than presence. Those papers describe how the
# data was collected and how Elo ratings are computed; they do not propose a method for
# predicting an individual pairwise preference from response text. The AES papers retrieved for
# essay — "DREsS: Dataset for Rubric-based Essay Scoring", "EssayJudge" — do propose scoring
# methods, evaluated on essay data plausibly including this competition's or its predecessors'
# (ASAP, Feedback Prize). So lmsys is cleaner in the "method tuned to this dataset" sense and
# not in the "corpus knows about this data" sense. Report it that way; do not claim more.
#
# The competition is also from 2024, so the backbone is less likely to have memorised it than
# spooky (2017) or jigsaw (2018).
#
# ── METRIC DIRECTION IS INVERTED relative to the essay experiment ───────────────────────
# lmsys-chatbot-arena predicts which of two model responses a human preferred (or a tie) and is
# scored by multi-class LOG LOSS: LOWER is better. essay uses quadratic weighted kappa, higher
# better. result_parse_agent decides direction once at startup from an LLM call; getting it
# wrong wastes the full 12 h. CHECK WITHIN THE FIRST 30 MINUTES:
#     kubectl logs job/mlevolve-lmsys-base | grep -iE "maximize|minimize|lower_is_better"
# Expect lower_is_better = True / maximize = False. Kill and relaunch if not.
#
# ── Prerequisites ───────────────────────────────────────────────────────────────────────
#   1. kubectl apply -f k8s/cliproxy-deployment.yaml && kubectl rollout status deploy/cliproxy
#   2. kubectl create secret generic mlevolve-llm-proxy --from-literal=LLM_API_KEY='<key>'
#   3. mlebench prepare -c lmsys-chatbot-arena --data-dir /workspace/data/mlebench
#   4. Retrieval gate — >= 8/10 on-topic with center=on, query=llm, or do not launch.
#      Use these keywords, and NOT hyphenated compounds:
#        preference,reward,rlhf,feedback,eval,pairwise,judge,arena,chatbot,align,rank
#      A first attempt used `llm-eval`, `human-feedback` and `alignment`. All three match zero
#      titles in the corpus because they never appear verbatim, which deflated the count to
#      7/10 and failed the gate on a task where retrieval was in fact excellent — the top hit
#      was the Chatbot Arena paper itself. probe_retrieval.py now warns about keywords that
#      match nothing, so this fails loudly rather than looking like a retrieval problem.
#      Read the TITLES, not just the count: the count saturated at 10/10 on essay and could
#      not discriminate between configurations there.
#   5. WARM THE CACHES BEFORE LAUNCHING. This is a new task, so the query cache is cold and B
#      and C would distil the query concurrently — two sampled LLM calls producing two
#      DIFFERENT queries, racing on the same tmp path, leaving the arms retrieving different
#      knowledge and the B-vs-C contrast meaningless. They would also each extract the same 20
#      papers, doubling the token spend and racing on the same *.md.tmp files. Run one
#      cold-start offline first (see the essay instructions), then confirm the run logs show
#      `distilled query (cached)` and `40 candidates: 40 cached, 0 missing`.
#   6. python k8s/validate.py
#
# ── Checks in the first ~40 minutes ─────────────────────────────────────────────────────
#   kubectl logs job/mlevolve-lmsys-base  | grep -iE "maximize|minimize"
#   kubectl logs job/mlevolve-lmsys-kb    | grep "Knowledge injected at draft"
#   kubectl logs job/mlevolve-lmsys-kbimp | grep -E "Knowledge injected at draft|injected .* literature"
#   kubectl logs deploy/cliproxy --since=30m | grep -cE " 429 | 5[0-9][0-9] "
# The two `Knowledge injected at draft` digests MUST match, or B vs C is not a clean contrast.

apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-lmsys-base
  labels:
    app: mlevolve
    experiment: lmsys
    variant: kb-off
    arm: a-baseline
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 46800
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: mlevolve
        experiment: lmsys
        variant: kb-off
        arm: a-baseline
    spec:
      restartPolicy: Never
      containers:
      - name: mlevolve
        image: pytorch/pytorch:2.7.1-cuda12.6-cudnn9-runtime
        command: ["bash", "/workspace/MLEvolve/k8s/entrypoint.sh"]
        env:
        - name: EXP_ID
          value: "lmsys-chatbot-arena"
        - name: DATASET_DIR
          value: "/workspace/data/mlebench"
        - name: REPO_DIR
          value: "/workspace/MLEvolve"
        - name: EXP_NAME
          value: "lmsys-base"
        - name: CPUS_PER_TASK
          value: "8"
        - name: SERVER_ID
          value: "21"               # port 5026
        - name: EXTRA_RUN_ARGS
          value: "agent.seed=42"
        # Route the agent through the shared proxy. These two are not secrets; the key is.
        # `env` takes precedence over `envFrom`, so this wins over any stale mlevolve-llm value.
        - name: LLM_BASE_URL
          value: "http://cliproxy:8317/v1"
        - name: LLM_MODEL
          value: "gpt-5.6-terra"     # verified: max_completion_tokens, tools and streaming all work
        envFrom:
        - secretRef:
            name: mlevolve-llm-proxy  # must provide LLM_API_KEY
        resources:                 # identical across all three arms
          requests:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: yuze-li-vol
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
apiVersion: batch/v1
