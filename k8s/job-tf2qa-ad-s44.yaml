# tensorflow2-question-answering (Natural Questions) — two-arm experiment, seed 44, through
# the shared CLIProxyAPI. Both run concurrently.
#
#   A  mlevolve-tf2qa-base-s44    no knowledge base
#   D  mlevolve-tf2qa-ana-s44     analogy retrieval at every improve node (engine/analogy)
#
#   bash k8s/prepare-task.sh tensorflow2-question-answering
#   kubectl apply  -f k8s/job-tf2qa-ad-s44.yaml     # 2 GPUs
#   kubectl delete -f k8s/job-tf2qa-ad-s44.yaml
#
# Replaces job-tf2qa-abc-s44.yaml (B/C arms, 2026-09-01): same task, same seed, retrieval
# path swapped for the improve-stage analogy agent. The B/C tf2qa runs stay in results/ as the
# task-semantic-retrieval baseline; nothing here is poolable with them beyond the A arm.
#
# ══ WHY THIS TASK ══════════════════════════════════════════════════════════════════════
# The answer to "找一下有没有哪个 task 的 dataset 是在 10GB 左右的": Natural Questions ships
# full Wikipedia articles as context, ~20 GB against jigsaw-toxic's ~60 MB, 307K training
# examples. It is NLP, so the corpus (four pure-NLP venue-years against one vision venue) should
# hold methods that are both relevant and executable.
#
# ── The risk, named before launching ────────────────────────────────────────────────────
# Reading comprehension, not classification: retrieve a long answer (paragraph) and a short
# answer (span) from a full Wikipedia page, scored by micro F1. lmsys is the cautionary case —
# two of three arms produced ZERO valid solutions in twelve hours. So the first check is not
# score or adoption but whether either arm produces a valid submission at all:
#
#   kubectl exec <dev-pod> -- bash -c 'for r in /workspace/MLEvolve/runs/*tf2qa-*-s44; do
#     echo "$(basename $r): $(ls $r/workspace/submission 2>/dev/null | wc -l) submissions"; done'
#
# If both arms sit at zero after a few hours, the honest conclusion is that this task is beyond
# the agent at a 12 h budget, and that is worth reporting rather than repeating.
#
# For the D arm there is a second question that only this task can answer: improve nodes exist
# only once a node runs, so on a task where most nodes are buggy the analogy agent fires rarely.
# logs/analogy/index.jsonl says how often it fired; a D arm with two invocations is not a test
# of retrieval.
#
# ── Storage: check before preparing ─────────────────────────────────────────────────────
# ~20 GB raw plus the prepared split (already on the PVC from the B/C draws).
#   kubectl exec <dev-pod> -- df -h /workspace
#
# ── Checks in the first ~40 minutes ─────────────────────────────────────────────────────
#   kubectl logs job/mlevolve-tf2qa-ana-s44 | grep -E "\[analogy\]|KB snapshot|KB venues"
#
# Expect `[analogy] corpus: N papers, sha1 <X>` at start and a `KB snapshot` line; the first
# `[analogy] node ...` line comes with the first improve node, which on this task may be hours in.
apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-tf2qa-base-s44
  labels:
    app: mlevolve
    experiment: tf2qa
    repeat: "10"
    variant: kb-off
    arm: a-baseline
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400     # 24 h wall clock, and it counts Pending time (see README)
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: mlevolve
        experiment: tf2qa
        repeat: "10"
        variant: kb-off
        arm: a-baseline
    spec:
      restartPolicy: Never
      # GPU type: only cards with >= 24 GB. Without this Nautilus hands out whatever is free — the
      # 2026-09-03 batch landed on 8 GB / 11 GB / 22 GB cards and 64 of 65 nodes died, most of
      # them CUDA OOM (see k8s/README.md "GPU type"). The list is deliberately wide (consumer
      # 3090/4090 up to A100) so scheduling stays quick; high-end cards are allowed, not required.
      #   kubectl get nodes -L nvidia.com/gpu.product --no-headers | awk '{print $NF}' | sort | uniq -c | sort -rn
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-3090          # 24 GB
                - NVIDIA-GeForce-RTX-4090          # 24 GB
                - NVIDIA-TITAN-RTX                 # 24 GB
                - NVIDIA-A10                       # 24 GB
                - NVIDIA-RTX-A5000                 # 24 GB
                - NVIDIA-L4                        # 24 GB
                - Tesla-V100-SXM2-32GB             # 32 GB
                - NVIDIA-A40                       # 48 GB
                - NVIDIA-RTX-A6000                 # 48 GB
                - NVIDIA-L40                       # 48 GB
                - NVIDIA-L40S                      # 48 GB
                - Quadro-RTX-8000                  # 48 GB
                - NVIDIA-A100-PCIE-40GB            # 40 GB
                - NVIDIA-A100-SXM4-40GB            # 40 GB
                - NVIDIA-A100-80GB-PCIe            # 80 GB
                - NVIDIA-A100-SXM4-80GB            # 80 GB
      containers:
      - name: mlevolve
        image: pytorch/pytorch:2.7.1-cuda12.6-cudnn9-runtime
        command: ["bash", "/workspace/MLEvolve/k8s/entrypoint.sh"]
        env:
        - name: EXP_ID
          value: "tensorflow2-question-answering"
        - name: DATASET_DIR
          value: "/workspace/data/mlebench"
        - name: REPO_DIR
          value: "/workspace/MLEvolve"
        - name: EXP_NAME
          value: "tf2qa-base-s44"
        - name: CPUS_PER_TASK
          value: "8"
        - name: SERVER_ID
          value: "66"               # port 5071
        - name: EXTRA_RUN_ARGS
          value: "agent.seed=44"
        # Route the agent through the shared proxy. These two are not secrets; the key is.
        # `env` takes precedence over `envFrom`, so this wins over any stale mlevolve-llm value.
        - name: LLM_BASE_URL
          value: "http://cliproxy:8317/v1"
        - name: LLM_MODEL
          value: "gpt-5.6-terra"     # verified: max_completion_tokens, tools and streaming all work
        envFrom:
        - secretRef:
            name: mlevolve-llm-proxy  # must provide LLM_API_KEY
        resources:                 # identical across both arms
          requests:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: yuze-li-vol
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-tf2qa-ana-s44
  labels:
    app: mlevolve
    experiment: tf2qa
    repeat: "10"
    variant: analogy-on
    arm: d-analogy-improve
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400     # 24 h wall clock, and it counts Pending time (see README)
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: mlevolve
        experiment: tf2qa
        repeat: "10"
        variant: analogy-on
        arm: d-analogy-improve
    spec:
      restartPolicy: Never
      # GPU type: only cards with >= 24 GB. Without this Nautilus hands out whatever is free — the
      # 2026-09-03 batch landed on 8 GB / 11 GB / 22 GB cards and 64 of 65 nodes died, most of
      # them CUDA OOM (see k8s/README.md "GPU type"). The list is deliberately wide (consumer
      # 3090/4090 up to A100) so scheduling stays quick; high-end cards are allowed, not required.
      #   kubectl get nodes -L nvidia.com/gpu.product --no-headers | awk '{print $NF}' | sort | uniq -c | sort -rn
      affinity:
        nodeAffinity:
