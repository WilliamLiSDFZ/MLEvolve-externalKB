# lmsys-chatbot-arena — three-arm experiment, REPEAT 5 (seed 44), through the shared
# CLIProxyAPI. All three run concurrently.
#
#   A  mlevolve-lmsys-base-s44    no knowledge base
#   B  mlevolve-lmsys-kb-s44      KB on, draft-stage injection only
#   C  mlevolve-lmsys-kbimp-s44   KB on, draft AND improve stages
#
#   kubectl apply  -f k8s/job-lmsys-abc-s44.yaml     # 3 GPUs
#   kubectl delete -f k8s/job-lmsys-abc-s44.yaml
#
# ── READ THIS BEFORE SPENDING 36 GPU-HOURS ──────────────────────────────────────────────
# This task has a measurement problem that more repeats will not fix, and it is worth being
# explicit about it before launching rather than discovering it again afterwards.
#
# The metric is 3-class log loss, so predicting a constant 1/3 scores ln(3) = 1.09861. Every
# usable run so far, best ensemble, as a percentage better than that trivial baseline:
#
#     C  1.00685   +8.4%        A  1.02607   +6.6%
#     B  1.01563   +7.6%        A  1.03101   +6.2%
#     C  1.01788   +7.3%        B  1.04961   +4.5%
#     B  1.02212   +7.0%        A  1.05187   +4.3%
#     A  1.02362   +6.8%        B  1.08526   +1.2%
#
# The agent barely beats constant prediction — the whole corpus spans 1.2% to 8.4%. The KB
# effects we are chasing are around 0.009 log loss, roughly 0.8% of ln(3), sitting inside that
# noise. From the observed paired sd, detecting 0.005 here needs about 250 draws. lmsys is in the
# same category as essay: the wrong instrument, not merely underpowered.
#
# One thing that is mildly interesting and worth one more draw: sorted by score, the top four
# runs are all KB arms (C, B, C, B) and three of the next four are baselines. The PAIRED analysis
# does not show this (B-A over 4 draws is -0.0094, signs -,-,+,+) because draw 1's arm B was an
# outlier at 1.08526. Whether the unpaired ordering means anything is exactly what an extra draw
# tests, cheaply.
#
# ── What this repeat is worth ───────────────────────────────────────────────────────────
# Arm C currently has only 2 usable draws on this task against 4 for A and B, so this mostly buys
# a third C. It will not produce significance. Launch it if you want lmsys reported as a properly
# balanced three-arm null; if the 36 GPU-hours are contested, jigsaw repeats are the better spend
# — see job-jigsaw-abc-s45.yaml, where C-B is at n=3, all positive, and about 8 draws from
# settling.
#
# ── Standing note on why this task was chosen at all ────────────────────────────────────
# It was picked as the counterpart to essay scoring: the retrieved essay literature is AES
# research plausibly built on this competition's own data or its predecessors, which a reviewer
# will discount first. lmsys is the partially cleaner comparison. That reasoning still holds; it
# just turned out that the cleaner task is also the one with almost no signal to measure.
#
# ── Checks in the first ~40 minutes ─────────────────────────────────────────────────────
#   kubectl logs job/mlevolve-lmsys-base-s44 | grep -iE "maximize|minimize"   # log loss, LOWER
#   kubectl logs job/mlevolve-lmsys-kb-s44   | grep -E "cached, .* missing|injected at draft"
#   kubectl logs job/mlevolve-lmsys-kbimp-s44| grep -E "injected at draft|literature techniques"
# Metric direction matters more here than elsewhere: if the direction call fails the agent
# defaults to maximize=True and spends twelve hours optimising log loss upward. analyze_runs.py
# has a rule for this (metric_direction_defaulted), but catching it in the first hour is better.
# The two KB arms must print the SAME draft digest.
apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-lmsys-base-s44
  labels:
    app: mlevolve
    experiment: lmsys
    repeat: "5"
    variant: kb-off
    arm: a-baseline
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400     # 24 h wall clock, and it counts Pending time (see README)
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: mlevolve
        experiment: lmsys
        repeat: "5"
        variant: kb-off
        arm: a-baseline
    spec:
      restartPolicy: Never
      containers:
      - name: mlevolve
        image: pytorch/pytorch:2.7.1-cuda12.6-cudnn9-runtime
        command: ["bash", "/workspace/MLEvolve/k8s/entrypoint.sh"]
        env:
        - name: EXP_ID
          value: "lmsys-chatbot-arena"
        - name: DATASET_DIR
          value: "/workspace/data/mlebench"
        - name: REPO_DIR
          value: "/workspace/MLEvolve"
        - name: EXP_NAME
          value: "lmsys-base-s44"
        - name: CPUS_PER_TASK
          value: "8"
        - name: SERVER_ID
          value: "33"               # port 5038
        - name: EXTRA_RUN_ARGS
          value: "agent.seed=44"
        # Route the agent through the shared proxy. These two are not secrets; the key is.
        # `env` takes precedence over `envFrom`, so this wins over any stale mlevolve-llm value.
        - name: LLM_BASE_URL
          value: "http://cliproxy:8317/v1"
        - name: LLM_MODEL
          value: "gpt-5.6-terra"     # verified: max_completion_tokens, tools and streaming all work
        envFrom:
        - secretRef:
            name: mlevolve-llm-proxy  # must provide LLM_API_KEY
        resources:                 # identical across all three arms
          requests:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: yuze-li-vol
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
