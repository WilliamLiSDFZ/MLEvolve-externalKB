        - name: EXP_NAME
          value: "jubias-ana-s46"
        - name: CPUS_PER_TASK
          value: "8"
        - name: SERVER_ID
          value: "74"               # port 5079
        - name: EXTRA_RUN_ARGS
          value: >-
            agent.seed=46
            analogy.enabled=True
            analogy.corpus_path=/workspace/Agentic_Knowledge_Base/output/paper_corpus
        # Route the agent through the shared proxy. These two are not secrets; the key is.
        # `env` takes precedence over `envFrom`, so this wins over any stale mlevolve-llm value.
