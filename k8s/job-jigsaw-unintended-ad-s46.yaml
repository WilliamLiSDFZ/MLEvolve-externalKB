        envFrom:
        - secretRef:
            name: mlevolve-llm-proxy  # must provide LLM_API_KEY
        resources:                 # identical across both arms
          requests:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: yuze-li-vol
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
