# jigsaw-unintended-bias-in-toxicity-classification — two-arm experiment, seed 46, through
# the shared CLIProxyAPI. Both run concurrently.
#
#   A  mlevolve-jubias-base-s46    no knowledge base
#   D  mlevolve-jubias-ana-s46     analogy retrieval at every improve node (engine/analogy)
#
#   bash k8s/prepare-task.sh jigsaw-unintended-bias-in-toxicity-classification
#   kubectl apply  -f k8s/job-jigsaw-unintended-ad-s46.yaml     # 2 GPUs
#   kubectl delete -f k8s/job-jigsaw-unintended-ad-s46.yaml
#
# Seeds 45-47 are the first A/D draws on this task; the seed 42-44 files (job-jigsaw-unintended-
# abc*.yaml) are the B/C record and will not start on this branch. Same task, same corpus,
# same seeds convention — only the retrieval path differs, so these three draws are directly
# comparable with the 2026-09-01 B/C draws on adoption.
#
# ══ WHY THIS TASK ══════════════════════════════════════════════════════════════════════
# 1.8M training rows (11x jigsaw-toxic) and the same domain as jigsaw-toxic, where the old
# retrieval failed in a way we can name: it handed a text-only competition multimodal meme
# papers and the agent adopted techniques in 3 of 89 nodes (3%). That gives this task a KNOWN
# FAILURE to check against:
#
#   - the analogy agent's queries must not be the competition's own nouns (toxic, comment,
#     identity...) — read logs/analogy/index.jsonl `queries`;
#   - its reports must not cite meme/multimodal papers as mechanisms for text-only data — the
#     "Feasibility with the available data" line of each mechanism is where that shows;
#   - adoption (KB repo measure_adoption.py, per improve node against its own report) must move
#     off 3%. That is the primary metric; the score needs 8+ draws and this is n<=3.
#
# ── Data size ───────────────────────────────────────────────────────────────────────────
# 1.8M rows; the prepared split is already on the PVC from the B/C draws. If it is not:
#   kubectl exec <dev-pod> -- df -h /workspace
#
# ── Checks in the first ~40 minutes ─────────────────────────────────────────────────────
#   kubectl logs job/mlevolve-jubias-ana-s46 | grep -E "\[analogy\]|KB snapshot|KB venues"
#   kubectl exec <dev-pod> -- cat /workspace/MLEvolve/runs/<run>/logs/analogy/index.jsonl
#
# Expect `[analogy] corpus: N papers, sha1 <X>` at start, a `KB snapshot` line, and at the first
# improve node `[analogy] node <id>: N mechanism(s) from M queries ...` — or `no report
# (reason)`, which is fine occasionally and a bug if it is every node.
apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-jubias-base-s46
  labels:
    app: mlevolve
    experiment: jigsaw-unintended-bias
    repeat: "10"
    variant: kb-off
    arm: a-baseline
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400     # 24 h wall clock, and it counts Pending time (see README)
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: mlevolve
        experiment: jigsaw-unintended-bias
        repeat: "10"
        variant: kb-off
        arm: a-baseline
    spec:
      restartPolicy: Never
      # GPU type: only cards with >= 24 GB. Without this Nautilus hands out whatever is free — the
      # 2026-09-03 batch landed on 8 GB / 11 GB / 22 GB cards and 64 of 65 nodes died, most of
      # them CUDA OOM (see k8s/README.md "GPU type"). The list is deliberately wide (consumer
      # 3090/4090 up to A100) so scheduling stays quick; high-end cards are allowed, not required.
      #   kubectl get nodes -L nvidia.com/gpu.product --no-headers | awk '{print $NF}' | sort | uniq -c | sort -rn
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-3090          # 24 GB
                - NVIDIA-GeForce-RTX-4090          # 24 GB
                - NVIDIA-TITAN-RTX                 # 24 GB
                - NVIDIA-A10                       # 24 GB
                - NVIDIA-RTX-A5000                 # 24 GB
                - NVIDIA-L4                        # 24 GB
                - Tesla-V100-SXM2-32GB             # 32 GB
                - NVIDIA-A40                       # 48 GB
                - NVIDIA-RTX-A6000                 # 48 GB
                - NVIDIA-L40                       # 48 GB
                - NVIDIA-L40S                      # 48 GB
                - Quadro-RTX-8000                  # 48 GB
                - NVIDIA-A100-PCIE-40GB            # 40 GB
                - NVIDIA-A100-SXM4-40GB            # 40 GB
                - NVIDIA-A100-80GB-PCIe            # 80 GB
                - NVIDIA-A100-SXM4-80GB            # 80 GB
      containers:
      - name: mlevolve
        image: pytorch/pytorch:2.7.1-cuda12.6-cudnn9-runtime
        command: ["bash", "/workspace/MLEvolve/k8s/entrypoint.sh"]
        env:
        - name: EXP_ID
          value: "jigsaw-unintended-bias-in-toxicity-classification"
        - name: DATASET_DIR
          value: "/workspace/data/mlebench"
        - name: REPO_DIR
          value: "/workspace/MLEvolve"
        - name: EXP_NAME
          value: "jubias-base-s46"
        - name: CPUS_PER_TASK
          value: "8"
        - name: SERVER_ID
          value: "73"               # port 5078
        - name: EXTRA_RUN_ARGS
          value: "agent.seed=46"
        # Route the agent through the shared proxy. These two are not secrets; the key is.
        # `env` takes precedence over `envFrom`, so this wins over any stale mlevolve-llm value.
        - name: LLM_BASE_URL
          value: "http://cliproxy:8317/v1"
        - name: LLM_MODEL
          value: "gpt-5.6-terra"     # verified: max_completion_tokens, tools and streaming all work
        envFrom:
        - secretRef:
            name: mlevolve-llm-proxy  # must provide LLM_API_KEY
        resources:                 # identical across both arms
          requests:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: yuze-li-vol
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-jubias-ana-s46
  labels:
    app: mlevolve
    experiment: jigsaw-unintended-bias
    repeat: "10"
    variant: analogy-on
    arm: d-analogy-improve
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400     # 24 h wall clock, and it counts Pending time (see README)
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: mlevolve
        experiment: jigsaw-unintended-bias
        repeat: "10"
        variant: analogy-on
        arm: d-analogy-improve
    spec:
      restartPolicy: Never
      # GPU type: only cards with >= 24 GB. Without this Nautilus hands out whatever is free — the
      # 2026-09-03 batch landed on 8 GB / 11 GB / 22 GB cards and 64 of 65 nodes died, most of
      # them CUDA OOM (see k8s/README.md "GPU type"). The list is deliberately wide (consumer
      # 3090/4090 up to A100) so scheduling stays quick; high-end cards are allowed, not required.
      #   kubectl get nodes -L nvidia.com/gpu.product --no-headers | awk '{print $NF}' | sort | uniq -c | sort -rn
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
