# tensorflow2-question-answering (Natural Questions) — three-arm experiment, DRAW 3 (seed 44),
# through the shared CLIProxyAPI.
#
#   A  mlevolve-tf2qa-base-s44     B  mlevolve-tf2qa-kb-s44     C  mlevolve-tf2qa-kbimp-s44
#
#   kubectl apply  -f k8s/job-tf2qa-abc-s44.yaml     # 3 GPUs
#   kubectl delete -f k8s/job-tf2qa-abc-s44.yaml
#
# Rationale, prepare-task command, storage warning and the checks are in k8s/job-tf2qa-abc.yaml.
#
# DO NOT LAUNCH THIS UNTIL DRAW 1 HAS PRODUCED A VALID SUBMISSION. Natural Questions is reading
# comprehension, structurally harder than anything attempted here, and lmsys is the warning: two
# of three arms produced zero valid solutions in twelve hours. Spending 72 more GPU-hours on
# draws 2 and 3 before knowing the agent can solve the task at all is how lmsys wasted five
# draws. Check first:
#
#   kubectl exec <dev-pod> -- bash -c 'for r in /workspace/MLEvolve/runs/*tf2qa-*-s42; do
#     echo "$(basename $r): $(ls $r/workspace/submission 2>/dev/null | wc -l) submissions"; done'
#
# prepare-task.sh does not need re-running once draw 1 has prepared the data and warmed caches.
apiVersion: batch/v1
kind: Job
metadata:
  name: mlevolve-tf2qa-base-s44
  labels:
    app: mlevolve
    experiment: tf2-qa
    repeat: "9"
    variant: kb-off
    arm: a-baseline
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400     # 24 h wall clock, and it counts Pending time (see README)
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: mlevolve
        experiment: tf2-qa
        repeat: "9"
        variant: kb-off
        arm: a-baseline
    spec:
      restartPolicy: Never
      containers:
      - name: mlevolve
        image: pytorch/pytorch:2.7.1-cuda12.6-cudnn9-runtime
        command: ["bash", "/workspace/MLEvolve/k8s/entrypoint.sh"]
        env:
        - name: EXP_ID
          value: "tensorflow2-question-answering"
        - name: DATASET_DIR
          value: "/workspace/data/mlebench"
        - name: REPO_DIR
          value: "/workspace/MLEvolve"
        - name: EXP_NAME
          value: "tf2qa-base-s44"
        - name: CPUS_PER_TASK
          value: "8"
        - name: SERVER_ID
          value: "66"               # port 5071
        - name: EXTRA_RUN_ARGS
          value: "agent.seed=44"
        # Route the agent through the shared proxy. These two are not secrets; the key is.
        # `env` takes precedence over `envFrom`, so this wins over any stale mlevolve-llm value.
        - name: LLM_BASE_URL
          value: "http://cliproxy:8317/v1"
        - name: LLM_MODEL
          value: "gpt-5.6-terra"     # verified: max_completion_tokens, tools and streaming all work
        envFrom:
        - secretRef:
            name: mlevolve-llm-proxy  # must provide LLM_API_KEY
        resources:                 # identical across all three arms
          requests:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: yuze-li-vol
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
