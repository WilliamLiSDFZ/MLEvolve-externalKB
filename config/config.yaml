# ============================================================
#  Data & paths
# ============================================================
data_dir: null
dataset_dir: ""  # path to mle-bench dataset root, e.g. /data/mle-bench
desc_file: null
goal: null
eval: null
exp_name: null
exp_id: ""

log_dir: ./runs
log_level: INFO
workspace_dir: ./runs
preprocess_data: True
copy_data: False

# Resource
start_cpu_id: 0
cpu_number: 21

# Model paths
torch_hub_dir: ""       # path to torch hub cache, e.g. /data/pretrain_models/torch_models
pretrain_model_dir: ""  # path to pretrained model weights, e.g. /data/pretrain_models

# ============================================================
#  Analogy retrieval (improve stage) — arm D when enabled
# ============================================================
# At every improve node an agent diagnoses the bottleneck of the node being improved, rewrites
# it as topic-independent queries, searches the paper corpus with BM25 and maps the mechanisms
# it finds back onto this pipeline (engine/analogy/, design doc in the KB repo:
# docs/analogy_bm25_agent_design.md). Per-node artefacts land in logs/analogy/.
# draft=True additionally injects task-level analogy into the first draft (arm E/F).
# Every key here must also exist in config/__init__.py
# (AnalogyConfig) — a YAML-only key is a ConfigKeyError at startup.
analogy:
  enabled: False                # False = arm A, unchanged
  improve: True                 # run the agent at every improve node (arm D)
  draft: False                  # run it ONCE on the task itself, before the first draft (arm E)
  corpus_path: ""               # dir with records.jsonl + manifest.json (KB repo: output/paper_corpus)
  max_turns: 14                 # includes source inspection and report correction
  top_k: 10                     # default hits per search_papers call (the agent may ask up to 20)
  max_mechanisms: 3             # mechanisms kept per report
  report_char_budget: 12000     # includes evidence + complete mechanisms; never sliced JSON
  max_output_tokens: 16384      # reasoning and visible output share this ceiling
  context:
    version: 2                 # saved old configurations without this field retain v1
    task_head_chars: 8000
    task_tail_chars: 3000
    data_chars: 6000
    plan_chars: 12000
    implementation_chars: 6000
    analysis_chars: 5000
    log_head_chars: 2000
    log_tail_chars: 6000
    attempts_chars: 10000
    trajectory_nodes: 10
    trajectory_plan_chars: 600
    runtime_chars: 12000
    max_packet_chars: 80000
    pretrained_chars: 4000
    max_input_tokens: 196608    # accumulated conversation per request; billed usage logged separately
    endpoint_context_tokens: 262144 # conservative configured cap, not measured proxy capacity
    input_safety_tokens: 8192
    final_report_reserve_tokens: 8192
  code_tools:
    enabled: True              # only exposed at improve; read-only episode node allow-list
    max_calls: 10
    max_total_chars: 120000
    max_read_chars: 20000
    default_read_lines: 200
    max_read_lines: 400
    max_diff_chars: 20000
  fulltext:
    enabled: False             # opt in to reading original text of retrieved papers (D/E/F)
    cache_dir: ""              # default: MLEvolve/cache/paper_fulltext; shared PVC on cluster
    offline: False             # True = exact cached versions only, no network
    max_papers: 3              # distinct open attempts per invocation, including failures
    max_read_calls: 12
    read_chars: 8000            # body characters returned per read_paper call
    total_chars: 40000          # cumulative returned body characters; repeat reads count
    open_timeout_seconds: 60.0 # includes lock wait, download and subprocess parsing
    total_open_seconds: 150.0  # cumulative open time per invocation

# ============================================================
#  Code execution
# ============================================================
candidate_runtime:
  enabled: false              # Opt in for NEW Jigsaw runs; no change to existing configurations.
  draft_budget_seconds: null # Includes training, validation and export; null uses exec.timeout.
  candidate_budget_seconds: null
  first_validation_seconds: 900
  validation_interval_seconds: 1800
  export_interval_seconds: 3600
  smoke_steps: 5
  smoke_rows: 128
  finalization_reserve_seconds: 900
  finalization_safety_factor: 1.5
  validation_fraction: 0.05
  keep_snapshots: 2

exec:
  timeout: 21600               # per-node execution cap, seconds. 6 h since 2026-09-04: at the old
                               # 9 h one stuck node ate 3/4 of the 12 h run budget (14 of 65 nodes
                               # in the 2026-09-03 jubias/tf2qa batch died this way). Runs before
                               # that date used 32400; the analysis tier reads this from logs/config.yaml.
  agent_file_name: runfile.py
  max_parallel_run: null       # auto: one candidate per visible CUDA GPU; CPU-only: one slot.
                               # A positive value can LOWER GPU concurrency, never oversubscribe it.

# ============================================================
#  Agent config
# ============================================================
agent:

  # --- Basic run params ---
  steps: 500
  time_limit: 43200          # 12h
  initial_drafts: 3
  seed: 42
  data_preview: True

  # --- LLM models ---
  # Credentials come from the ENVIRONMENT, never from this file (it is in git) and never
  # from the command line (argv shows up in `ps` and in `set -x` logs).
  # Set LLM_API_KEY / LLM_BASE_URL / LLM_MODEL — the k8s Secret provides them in-cluster.
  # New experiments use GPT-5.6 Sol via Responses, with explicit role/effort.
  # Sampling settings are omitted. Historical model overrides remain supported.
  code:
    model: ${oc.env:LLM_MODEL,gpt-5.6-sol}
    temp: 1
    reasoning_effort: ${oc.env:LLM_REASONING_EFFORT,high}
    max_output_tokens: 16384
    base_url: ${oc.env:LLM_BASE_URL,https://api.openai.com/v1}
    api_key: ${oc.env:LLM_API_KEY,""}
  feedback:
    model: ${oc.env:LLM_MODEL,gpt-5.6-sol}
    temp: 1
    reasoning_effort: ${oc.env:LLM_REASONING_EFFORT,high}
    max_output_tokens: 16384
    base_url: ${oc.env:LLM_BASE_URL,https://api.openai.com/v1}
    api_key: ${oc.env:LLM_API_KEY,""}

  # --- Submission check ---
  check_data_leakage: True

  # --- Code gen mode ---
  use_diff_mode: True                 # Multi-Mode Codegen
  use_stepwise_generation: True       # Multi-Mode Codegen

  # --- Triggered-action master switches (ablation use) ---
  use_evolution: True                # intra-branch evolution on stagnation
  use_fusion: True                   # cross-branch fusion on stagnation (>=6h)
  use_aggregation: True              # multi-branch aggregation at root

  # --- Branch strategy ---
  fusion_vs_evolution_prob: 0.3
  branch_fusion_trigger_prob: 1.0
  max_fusion_drafts: 2

  # --- Global memory ---
  use_global_memory: True
  memory_similarity_threshold: 0.7
  memory_embedding_device: cuda
  memory_embedding_model_path: "BAAI/bge-base-en-v1.5"  # HuggingFace model name or local path

  # --------------------------------------------------------
  #  Search tree params
  # --------------------------------------------------------
  search:
    # Parallel & resources
    parallel_search_num: 3     # search/LLM workers; independent of GPU execution slots
    num_gpus: 1

    # Node expansion limits
    num_drafts: 5
    num_bugs: 1
    num_improves: 3
    topk_max_improves: 10

    # Debug depth
    max_debug_depth: 20
    back_debug_depth: 3
    debug_prob: 1

    # Improvement criteria
    metric_improvement_threshold: 0.0001
    max_improve_failure: 3

    # Stagnation detection
    branch_stagnation_threshold: 3
    topk_stagnation_threshold: 6
    stagnation_window: 4
    top_candidates_size: 20

    # Explore-exploit soft switch
    explore_switch_start: 0.5
    explore_switch_end: 0.7
    min_exploration_weight: 0.2       # Top-K enabled

    # Top-K node selection
    topk_early_k: 5
    topk_early_max_per_branch: 3
    topk_late_k: 3
    topk_late_max_per_branch: 2

    # Force backprop
    force_backprop_late_threshold: 0.80
    force_backprop_late_prob: 0.5
    force_backprop_mid_threshold: 0.4
    force_backprop_mid_modulo: 3
    recent_best_window: 4

    # Multi-branch fusion conditions
    fusion_min_time_hours: 6
    fusion_max_time_hours: 10
    fusion_min_successful_nodes: 2
    fusion_min_branches: 2

    # Stagnation detection master switch (ablation: set False for vanilla MCTS baseline)
    use_stagnation_detection: True

  # --------------------------------------------------------
  #  Exploration constant decay
  # --------------------------------------------------------
  decay:
    exploration_constant: 1.414
    lower_bound: 0.5
    alpha: 0.01
    phase_ratios: [ 0.3, 0.7 ]

# ============================================================
#  Cold-start knowledge
# ============================================================
coldstart:
  use_coldstart: True                 # Cold-start KB enabled
  task_json_path: "engine/coldstart/competition_tag_classified.json"
  model_json_path: "engine/coldstart/models_guidance_classified.json"
  description: ""                     # runtime: pretrained-model guidance ONLY
